<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro | NexaVision</title>

    <link rel="stylesheet" href="css/estilos1.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <style>

        * {

            box-sizing: border-box;

        }


        body {

            margin: 0;

            font-family: 'Poppins', sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #2563EB22,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom,
                    #00C85322,
                    transparent 35%
                ),
                #0A2540;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            color: white;

        }


        /* =========================
                REGISTRO
        ========================= */

        .registro {

            width: 100%;

            max-width: 520px;

            background: rgba(255,255,255,.05);

            border: 1px solid rgba(255,255,255,.08);

            backdrop-filter: blur(15px);

            border-radius: 25px;

            padding: 40px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.25);

        }


        .logo {

            width: 110px;

            display: block;

            margin: auto;

        }


        .registro h2 {

            text-align: center;

            color: #00C853;

            margin: 20px 0 5px;

        }


        .descripcion {

            text-align: center;

            color: #bfc8d2;

            margin-bottom: 30px;

            font-size: 14px;

        }


        /* =========================
                  INPUTS
        ========================= */

        .campo {

            margin-bottom: 18px;

        }


        .campo label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            color: #d7dce2;

        }


        input {

            width: 100%;

            padding: 15px;

            border: 1px solid transparent;

            border-radius: 10px;

            background: #132c47;

            color: white;

            font-family: inherit;

            font-size: 15px;

            transition: .3s;

        }


        input:focus {

            outline: none;

            border-color: #00C853;

            box-shadow:
                0 0 0 3px rgba(0,200,83,.12);

        }


        input::placeholder {

            color: #8f9cac;

        }
        .password-box {
            position: relative;
            width: 100%;
        }

        .password-box input {
            width: 100%;
            padding-right: 50px;
        }

        .password-box .ver-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);

            width: 40px;
            height: 40px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: none;
            color: #00C853;
            border-radius: 50%;

            cursor: pointer;
        }

        .password-box .ver-password:hover {
            background: transparent;
            color: white;
            transform: translateY(-50%);
        }


        /* =========================
                  TELÉFONO
        ========================= */

        .telefono {

            display: flex;

        }


        .telefono span {

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 0 17px;

            background: #081b30;

            color: #00C853;

            font-weight: 600;

            border-radius: 10px 0 0 10px;

        }


        .telefono input {

            border-radius: 0 10px 10px 0;

        }


        /* =========================
                   CÁMARA
        ========================= */

        .camara {

            margin-top: 30px;

            background: #0d233a;

            border: 2px dashed #00C853;

            border-radius: 18px;

            padding: 20px;

            text-align: center;

        }


        .camara h3 {

            margin-top: 0;

            margin-bottom: 5px;

        }


        .camara-texto {

            color: #aeb9c5;

            font-size: 13px;

            margin-bottom: 18px;

        }


        .video-contenedor {

            width: 100%;

            position: relative;

            overflow: hidden;

            border-radius: 15px;

            background: #06192b;

            margin-bottom: 15px;

        }


        video {

            display: block;

            width: 100%;

            aspect-ratio: 4 / 3;

            object-fit: cover;

            transform: scaleX(-1);

        }


        #fotoPreview {

            display: none;

            width: 100%;

            aspect-ratio: 4 / 3;

            object-fit: cover;

        }


        canvas {

            display: none;

        }


        .estado-camara {

            margin: 12px 0;

            font-size: 13px;

            color: #b8c5d1;

        }


        .estado-camara.correcto {

            color: #00C853;

        }


        .estado-camara.error {

            color: #ff5b5b;

        }


        /* =========================
                  BOTONES
        ========================= */

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 50px;

            background: #00C853;

            color: white;

            font-family: inherit;

            font-size: 16px;

            font-weight: 500;

            cursor: pointer;

            transition: .3s;

        }


        button:hover {

            background: #2563EB;

            transform: translateY(-2px);

        }


        button:disabled {

            opacity: .5;

            cursor: not-allowed;

            transform: none;

        }


        .botones-camara {

            display: flex;

            gap: 10px;

        }


        .btn-secundario {

            background: transparent;

            border: 2px solid #00C853;

        }


        .btn-secundario:hover {

            background: #00C853;

        }


        .btn-registrar {

            margin-top: 25px;

        }


        /* =========================
                  MENSAJE
        ========================= */

        #mensaje {

            display: none;

            margin-top: 20px;

            padding: 14px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;

        }


        #mensaje.error {

            display: block;

            background: rgba(255,77,77,.12);

            border: 1px solid #ff5656;

            color: #ff9a9a;

        }


        #mensaje.exito {

            display: block;

            background: rgba(0,200,83,.12);

            border: 1px solid #00C853;

            color: #73ef9e;

        }


        /* =========================
                   LOGIN
        ========================= */

        .login {

            text-align: center;

            margin-top: 25px;

            color: #cbd3dc;

        }


        .login a {

            color: #00C853;

            text-decoration: none;

        }


        .volver {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #9dabba;

            text-decoration: none;

            font-size: 14px;

        }


        /* =========================
                 RESPONSIVE
        ========================= */

        @media(max-width: 600px) {

            body {

                padding: 20px 12px;

            }


            .registro {

                padding: 28px 20px;

            }


            .botones-camara {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<div class="registro">


    <img
        src="logo2.png"
        alt="NexaVision"
        class="logo"
    >


    <h2>Crear Cuenta</h2>


    <p class="descripcion">

        Registra tus datos y realiza una captura facial
        para completar tu identificación.

    </p>


    <form id="formRegistro">


        <!-- NOMBRE -->

        <div class="campo">

            <label for="nombre">

                Nombre

            </label>

            <input
                id="nombre"
                type="text"
                name="nombre"
                placeholder="Nombre"
                required
            >

        </div>


        <!-- APELLIDOS -->

        <div class="campo">

            <label for="apellido">

                Apellidos

            </label>

            <input
                id="apellido"
                type="text"
                name="apellido"
                placeholder="Apellidos"
                required
            >

        </div>


        <!-- CORREO -->

        <div class="campo">

            <label for="correo">

                Correo electrónico

            </label>

            <input
                id="correo"
                type="email"
                name="correo"
                placeholder="correo@ejemplo.com"
                required
            >

        </div>


        <!-- TELÉFONO -->

        <div class="campo">

            <label for="telefono">

                Teléfono

            </label>


            <div class="telefono">

                <span>

                    +56

                </span>


                <input
                    id="telefono"
                    type="tel"
                    name="telefono"
                    placeholder="912345678"
                    maxlength="9"
                    pattern="[0-9]{9}"
                    required
                >

            </div>

        </div>


        <!-- CONTRASEÑA -->

        <div class="campo">

            <label for="clave">
                Contraseña
            </label>

            <div class="password-box">

                <input
                    id="clave"
                    type="password"
                    name="clave"
                    placeholder="Contraseña"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="ver-password"
                    onclick="verPassword('clave', this)"
                >
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>

        </div>


        <!-- CONFIRMAR CONTRASEÑA -->

        <div class="campo">

            <label for="confirmar">
                Confirmar contraseña
            </label>

            <div class="password-box">

                <input
                    id="confirmar"
                    type="password"
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="ver-password"
                    onclick="verPassword('confirmar', this)"
                >
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>

        </div>


        <!-- ======================
                 CÁMARA
        ======================= -->

        <div class="camara">


            <h3>

                <i class="fa-solid fa-camera"></i>

                Captura Facial

            </h3>


            <p class="camara-texto">

                Mira directamente a la cámara y asegúrate
                de tener buena iluminación.

            </p>


            <div class="video-contenedor">


                <video
                    id="video"
                    autoplay
                    playsinline
                    muted
                ></video>


                <img
                    id="fotoPreview"
                    alt="Fotografía capturada"
                >


            </div>


            <canvas
                id="canvas"
                width="640"
                height="480"
            ></canvas>


            <div class="botones-camara">


                <button
                    type="button"
                    id="btnCamara"
                    class="btn-secundario"
                >

                    <i class="fa-solid fa-video"></i>

                    Activar cámara

                </button>


                <button
                    type="button"
                    id="btnCapturar"
                    disabled
                >

                    <i class="fa-solid fa-camera"></i>

                    Capturar

                </button>


            </div>


            <p
                id="estadoCamara"
                class="estado-camara"
            >

                Cámara desactivada

            </p>


        </div>


        <div id="mensaje"></div>


        <button
            type="submit"
            id="btnRegistrar"
            class="btn-registrar"
        >

            <i class="fa-solid fa-user-plus"></i>

            Registrarse

        </button>


    </form>


    <div class="login">

        ¿Ya tienes cuenta?

        <a href="inisesion.html">

            Iniciar sesión

        </a>

    </div>


    <a
        href="index.html"
        class="volver"
    >

        ← Volver a NexaVision

    </a>


</div>



<script>


/* ==================================
       ELEMENTOS DEL DOCUMENTO
================================== */


const form = document.getElementById("formRegistro");

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const fotoPreview =
    document.getElementById("fotoPreview");

const btnCamara =
    document.getElementById("btnCamara");

const btnCapturar =
    document.getElementById("btnCapturar");

const btnRegistrar =
    document.getElementById("btnRegistrar");

const estadoCamara =
    document.getElementById("estadoCamara");

const mensaje =
    document.getElementById("mensaje");


let stream = null;

let fotoBlob = null;



/* ==================================
          ACTIVAR CÁMARA
================================== */


btnCamara.addEventListener(
    "click",
    async () => {

        try {

            stream =
                await navigator.mediaDevices.getUserMedia({

                    video: {

                        facingMode: "user",

                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        }

                    },

                    audio: false

                });


            video.srcObject = stream;


            video.style.display = "block";

            fotoPreview.style.display = "none";


            btnCapturar.disabled = false;


            estadoCamara.textContent =
                "Cámara activa. Mira al frente.";


            estadoCamara.className =
                "estado-camara correcto";


        }

        catch(error) {

            console.error(error);


            estadoCamara.textContent =
                "No fue posible acceder a la cámara.";


            estadoCamara.className =
                "estado-camara error";

        }

    }
);



/* ==================================
           CAPTURAR FOTO
================================== */


btnCapturar.addEventListener(
    "click",
    () => {


        if (!stream) {

            return;

        }


        const contexto =
            canvas.getContext("2d");


        canvas.width =
            video.videoWidth || 640;

        canvas.height =
            video.videoHeight || 480;


        /*
        Volteamos el canvas para guardar
        la misma orientación que ve el usuario.
        */

        contexto.save();

        contexto.translate(
            canvas.width,
            0
        );

        contexto.scale(
            -1,
            1
        );


        contexto.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        contexto.restore();


        canvas.toBlob(
            blob => {


                if (!blob) {

                    estadoCamara.textContent =
                        "No se pudo capturar la fotografía.";

                    return;

                }


                fotoBlob = blob;


                const urlFoto =
                    URL.createObjectURL(blob);


                fotoPreview.src =
                    urlFoto;


                video.style.display =
                    "none";


                fotoPreview.style.display =
                    "block";


                estadoCamara.textContent =
                    "Fotografía capturada correctamente.";


                estadoCamara.className =
                    "estado-camara correcto";


                btnCapturar.innerHTML =
                    '<i class="fa-solid fa-rotate"></i> Volver a capturar';


                video.style.display =
                    "none";


            },

            "image/jpeg",

            0.92

        );

    }
);



/* ==================================
       VOLVER A MOSTRAR CÁMARA
================================== */


btnCapturar.addEventListener(
    "click",
    () => {

        if (
            fotoBlob &&
            fotoPreview.style.display === "block"
        ) {

            setTimeout(() => {

                video.style.display = "block";

            }, 100);

        }

    }
);



/* ==================================
        ENVIAR REGISTRO
================================== */


form.addEventListener(
    "submit",
    async event => {


        event.preventDefault();


        mensaje.className = "";

        mensaje.style.display = "none";


        const clave =
            document.getElementById("clave").value;


        const confirmar =
            document.getElementById("confirmar").value;


        if (clave !== confirmar) {

            mostrarError(
                "Las contraseñas no coinciden."
            );

            return;

        }


        if (!fotoBlob) {

            mostrarError(
                "Debes capturar tu rostro antes de registrarte."
            );

            return;

        }


        const datos =
            new FormData();


        datos.append(
            "nombre",
            document.getElementById("nombre").value
        );


        datos.append(
            "apellido",
            document.getElementById("apellido").value
        );


        datos.append(
            "correo",
            document.getElementById("correo").value
        );


        datos.append(
            "telefono",
            "+56" +
            document.getElementById("telefono").value
        );


        datos.append(
            "clave",
            clave
        );


        datos.append(
            "foto",
            fotoBlob,
            "rostro.jpg"
        );


        btnRegistrar.disabled = true;


        btnRegistrar.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Registrando...';


        try {


            /*
            Mientras desarrollas FastAPI localmente:
            */

            const respuesta =
                await fetch(
                    "http://127.0.0.1:8000/registro",
                    {

                        method: "POST",

                        body: datos

                    }
                );


            const resultado =
                await respuesta.json();


            if (!respuesta.ok) {

                mostrarError(
                    resultado.detail ||
                    resultado.mensaje ||
                    "No fue posible completar el registro."
                );

                return;

            }


            mensaje.textContent =
                resultado.mensaje ||
                "Usuario registrado correctamente.";


            mensaje.className =
                "exito";


            form.reset();


            fotoBlob = null;


            fotoPreview.style.display =
                "none";


            video.style.display =
                "block";


            detenerCamara();


        }

        catch(error) {


            console.error(error);


            mostrarError(
                "No se pudo conectar con el servidor FastAPI."
            );


        }

        finally {


            btnRegistrar.disabled = false;


            btnRegistrar.innerHTML =
                '<i class="fa-solid fa-user-plus"></i> Registrarse';


        }


    }
);



/* ==================================
              ERROR
================================== */
function verPassword(id, boton) {

    const input = document.getElementById(id);
    const icono = boton.querySelector("i");

    if (input.type === "password") {

        input.type = "text";

        icono.classList.remove("fa-eye");
        icono.classList.add("fa-eye-slash");

    } else {

        input.type = "password";

        icono.classList.remove("fa-eye-slash");
        icono.classList.add("fa-eye");

    }
}


function mostrarError(texto) {


    mensaje.textContent =
        texto;


    mensaje.className =
        "error";


}



/* ==================================
          DETENER CÁMARA
================================== */


function detenerCamara() {


    if (stream) {


        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );


        stream = null;


    }


    btnCapturar.disabled =
        true;


    estadoCamara.textContent =
        "Cámara desactivada";


    estadoCamara.className =
        "estado-camara";


}



/* ==================================
       CERRAR AL SALIR
================================== */


window.addEventListener(
    "beforeunload",
    detenerCamara
);


</script>


</body>

</html>
